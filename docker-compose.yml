version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: govassist-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: govassist-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=government_scheme_assistant
      - JWT_SECRET=govassist_secure_production_secret
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - mongodb
    volumes:
      - chroma-data:/app/backend/chroma_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: govassist-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  chroma-data:
